
buildscript {
    repositories {
        mavenCentral()
    }


    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: "org.jetbrains.kotlin.jvm"


dependencies {

    api project(":microservice-canvas-model")
    api("org.springframework.boot:spring-boot-starter-thymeleaf:$springBootVersion")
    api "tools.jackson.module:jackson-module-kotlin:$jacksonVersion"
    api "tools.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"

    testImplementation project(":microservice-canvas-builder")
    testImplementation "commons-io:commons-io:2.5"
    testImplementation "org.hamcrest:hamcrest:$hamcrestVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"

}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
